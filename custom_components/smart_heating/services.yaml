set_profile:
  fields:
    profile:
      required: true
      example: Office
      selector:
        text:
set_mode:
  fields:
    mode:
      required: true
      selector:
        select:
          options: [auto, manual, "off", frost]
boost:
  fields:
    zone:
      required: true
      example: Kitchen
      selector:
        text:
    target:
      selector:
        number: {min: 5, max: 25, step: 0.5, unit_of_measurement: "°C"}
    position:
      selector:
        number: {min: 0, max: 10, mode: box}
    minutes:
      selector:
        number: {min: 1, max: 480, unit_of_measurement: min, mode: box}
cancel_boost:
  fields:
    zone:
      selector:
        text:
resume:
recalculate:
